services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/app
      - wireguard_configs:/etc/wireguard
      - sqlite_data:/data
    environment:
      - APP_ENV=development
      - WG_MOCK=true

  ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
